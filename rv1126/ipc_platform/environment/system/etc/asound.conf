pcm.!default
{
    type asym
    playback.pcm "plug:softvol_ply"
    capture.pcm "plug:micin"
}

pcm.dmixer0 {
    type dmix
    ipc_key 5978290 # must be unique for all dmix plugins!!!!
    ipc_key_add_uid yes
    slave {
        pcm "hw:0,0"
        channels 2
        period_size 320
        buffer_size 1280
                rate 16000 
    }
    bindings {
        0 0
        1 1
    }
}

pcm.softvol_ply {
    type softvol
    slave.pcm "dmixer0"
    control {
        name "Master Playback Volume"
        card 0
        device 0
    }
    min_dB -50.0
    max_dB 0.0
    resolution 101
}

pcm_slave.ins {
    pcm "hw:0,0"
    channels 4
    rate 16000
    format S16_LE
    period_size 320
    buffer_size 1280
}

pcm.pcmin1_dsnoop {
    type dsnoop
    ipc_key 5678293
    ipc_key_add_uid yes
    tstamp_type monotonic
    slowptr 0
    slave ins
    bindings.0 0
    bindings.1 1
}

pcm.micin {
    type plug
    slave.pcm "pcmin1_dsnoop"
    hint {
                show {
                        @func refer
                        name defaults.namehint.basic
                }
                description "mic+lp 2 channel for audio capture"
        }
}

pcm.pcmin2_dsnoop {
    type dsnoop
    ipc_key 5678293
    ipc_key_add_uid yes
    tstamp_type monotonic
    slowptr 0
    slave ins
    bindings.0 2
    bindings.1 3
}

pcm.linein {
    type plug
    slave.pcm "pcmin2_dsnoop"
    hint {
                show {
                        @func refer
                        name defaults.namehint.basic
                }
                description "linein +lp 2 channel for audio capture"
        }
}
