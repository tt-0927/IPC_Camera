# help.conf

# 获取配置文件所在目录
HELP_PATH=$(dirname "$(realpath "${BASH_SOURCE[0]}")")

# 加载 log.conf 配置文件
source "$HELP_PATH/log.conf"

# 帮助信息函数
display_help() {
    info "帮助说明: "
    info "用法: $0 [选项]"
    info "选项:"
    info "-d <设备型号>         设置设备型号(TV-3881T)"
    info "-m <程序名>           编译单个目标程序"
    info "-b <构建模式>         设置构建模式(例如, Debug、Release)(默认：Release)"
    info "-t <升级包类型>       指定编译升级包的类型(例如, app、model)(默认：all)"
    info "--project <项目类型>  指定编译升级包的项目类型(例如, itc、中性)"
    info "-a                   编译所有目标程序"
    info "-p                   编译升级包"
    info "-i                   编译固件包"
    info "-v                   指定版本号"
    info "-c                   清理所有临时文件与目录"
    info "--autofile           自动摆渡文件"
    info "-h                   显示此帮助信息"
    info ""
    info "示例："
    info "设置设备型号："
    trace "  ./build.sh -d TV-3881T"
    info "编译stream程序："
    trace "  ./build.sh -m stream"
    info "编译stream程序 自动摆渡stream程序："
    trace "  ./build.sh -m stream --autofile"
    info "编译所有目标程序 自动摆渡所有目标程序："
    trace "  ./build.sh -a --autofile"
    info "编译所有目标程序 设置构建模式为Debug："
    trace "  ./build.sh -a -b Debug"
    info "编译程序升级包(不添加-t,默认-t all)："
    trace "  ./build.sh -p -v V1.0.1 -t app --project itc"
    info "编译AI模型升级包(不添加-t,默认-t all)："
    trace "  ./build.sh -p -v V1.0.1 -t model --project itc"
    info "编译升级包 设置构建模式为Debug："
    trace "  ./build.sh -p -v V1.0.1 -b Debug  --project itc"
    info "编译升级包 自动摆渡升级包："
    trace "  ./build.sh -p -v V1.0.1 -t app  --project itc --autofile"
    info "编译固件包："
    trace "  ./build.sh -i -v V1.0.1  --project itc"
    info "编译固件包 设置构建模式为Debug："
    trace "  ./build.sh -i -v V1.0.1 -b Debug  --project itc"
    info "编译固件包 自动摆渡升级包、固件包："
    trace "  ./build.sh -i -v V1.0.1  --project itc --autofile"
}