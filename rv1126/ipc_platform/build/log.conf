#!/bin/bash

# 颜色
COLOUR_END="\033[m"
COLOUR_RED="\033[1;32;31m"
COLOUR_GREEN="\033[1;32;32m"
COLOUR_BLUE="\033[1;32;34m"
COLOUR_LIGHT_PURPLE="\033[1;35m"
COLOUR_YELLOW="\033[1;33m"

# 日志函数

function error()
{
    echo -e $COLOUR_RED$1$COLOUR_END
}

function warn()
{
    echo -e $COLOUR_YELLOW$1$COLOUR_END
}

function info()
{
    echo -e $COLOUR_GREEN$1$COLOUR_END
}

function trace()
{
    echo -e $COLOUR_LIGHT_PURPLE$1$COLOUR_END
}

function debug()
{
    echo -e $COLOUR_BLUE$1$COLOUR_END
}

