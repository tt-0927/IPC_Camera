# path.conf 脚本环境配置文件

# 获取配置文件所在目录
BUILD_ROOT_PATH=$(dirname "$(realpath "${BASH_SOURCE[0]}")")

# 加载 log.conf 配置文件
source "$BUILD_ROOT_PATH/log.conf"
# 设置项目根目录
PROJECT_ROOT_PATH="$BUILD_ROOT_PATH/../.."
# git仓库目录
GIT_ROOT_PATH="$BUILD_ROOT_PATH/../../rv1126b_ipc"
# 设置顶层CMakelist.txt所在路径
SRC_ROOT_PATH="$BUILD_ROOT_PATH/../../rv1126b_ipc"
#临时文件输出路径
OUTPUT_DIR_NAME=$BUILD_ROOT_PATH/../../output
#cmake临时文件输出路径
CMAKE_TEMP_PATH=$OUTPUT_DIR_NAME/cmake_temp
# 自动摆渡文件
AUTO_FILE="$BUILD_ROOT_PATH/compile.sh"

# 输出路径
BIN_PATH=$OUTPUT_DIR_NAME/bin
STRIP_BIN_PATH=$OUTPUT_DIR_NAME/bin_strip
PACK_BIN_PATH=$OUTPUT_DIR_NAME/packet
IMAGE_BIN_PATH=$OUTPUT_DIR_NAME/image

# 设置cmake默认编译类型，打升级包、镜像都固定编译Release版本
BUILD_TYPE="-DBUILD_VERSION=Release"

# 设置版本文件路径
GIT_VERSION_FILE=$SRC_ROOT_PATH/include/git_version.h
# 版本号
GIT_VERSION=$(git -C "$GIT_ROOT_PATH" describe --dirty --always)

# 记录本地型号文件
LOCAL_DEVICE_FILE="$BUILD_ROOT_PATH/device.txt"
# 从本地型号文件读取型号
if [ -f "$LOCAL_DEVICE_FILE" ]; then
    DEVICE_TYPE=$(cat "$LOCAL_DEVICE_FILE")
else
    DEVICE_TYPE=""
fi
# 定义支持的设备类型数组
DEVICE_TYPES=("TV-3881T TV-3882TI")

# 检查设备类型是否有效的函数
check_device_type() {
    local device_type=$1

    if [[ " ${DEVICE_TYPES[@]} " =~ " $device_type " ]]; then
        info "当前设备型号: $device_type" $LINENO
    else
        error "不支持的型号: $device_type, 请重新输入" $LINENO
        exit 1
    fi
}

# 设置设备类型的函数
set_device_type() {
    local device_type=$1

    # 使用 [[ ... ]] 结构和数组包含性检查
    if [[ " ${DEVICE_TYPES[@]} " =~ " $device_type " ]]; then
        # 重定向并重载型号到本地文件
        echo $device_type >$LOCAL_DEVICE_FILE
        DEVICE_TYPE=$device_type
        info "============> 设置型号：$device_type <============" $LINENO
        exit 0
    else
        error "不支持的型号: $device_type ,请重新输入" $LINENO
        exit 1
    fi
}

# 检查设备类型是否有效的函数
check_device_file() {
    # 判断是否存在本地型号文件
    if [ ! -f "$LOCAL_DEVICE_FILE" ]; then
        # 不存在需提示创建
        error "请先确定当前构建的型号, eg: ./build.sh -d 型号 " $LINENO
        exit 1
    fi
}

# 定义支持的编译类型数组
BUILD_MODES=("Release" "Debug")

# 检查编译类型是否有效的函数
check_buile_type() {
    local buile_type=$1

    # 使用 [[ ... ]] 结构和数组包含性检查
    if [[ " ${BUILD_MODES[@]} " =~ " $buile_type " ]]; then
        info "当前编译模式: $buile_type"
    else
        error "不支持的编译模式: $buile_type, 请重新输入"
        return 1
    fi
}

# 设置版本号
# 定义一个数组，包含需要移除的字符串
# remove_array=("_TV-6204K" "_tv-6204k" "_TV-6124HU" "_tv-6124hu")
set_version() {
    info "============> 当前git版本号 $GIT_VERSION <============"
    #生成版本头文件
    echo '#ifndef _GIT_VERSION_H' >$GIT_VERSION_FILE
    echo "#define _GIT_VERSION_H" >>$GIT_VERSION_FILE
    echo "#define _VERSION \""$GIT_VERSION"\"" >>$GIT_VERSION_FILE
    echo '#endif' >>$GIT_VERSION_FILE
    sync
    info "成功生成版本头文件$GIT_VERSION_FILE"

    # 版本号
    VERSION_NUM=$GIT_VERSION
    # 使用循环移除所有的字符串
    for i in "${remove_array[@]}"; do
        VERSION_NUM=${VERSION_NUM//$i/}
    done
    info "============> 当前软件版本号 $VERSION_NUM <============"
}

# 拷贝第三方库文件
copy_third_party_libs() {
    local src_dir="$1"
    local dst_dir="$2"

    # 要排除的相对子目录路径（相对于 $src_dir）
    local EXCLUDE_DIRS=("faac" "gmssl" "MemoryCheck" "rtmp" "srt" "twolame" "x264" "x265" "ZLMediaKit") #"fdk-aac" "ffmpeg"

    if [ ! -d "$src_dir" ]; then
        error "源目录不存在：$src_dir"
        return 1
    fi

    mkdir -p "$dst_dir"

    # 进入源目录，处理匹配的库文件（包括软链接）
    (
        cd "$src_dir" || exit 1

        # 构建 find 命令参数
        local find_cmd=(find .)

        # 先排除目录
        for dir in "${EXCLUDE_DIRS[@]}"; do
            find_cmd+=(-path "./$dir" -prune -o)
        done

        # 根据机型追加不同的 -name 条件
        case "$DEVICE_TYPE" in
            TV-3882TI)
                # 882TI：需要额外带上 librkllmrt.so 和 librockiva.so
                find_cmd+=(
                    \( -type f -o -type l \)   # 普通文件或符号链接
                    -a \( -name "lib*.so" -o -name "lib*.so.*" \
                        -o -name "librkllmrt.so" -o -name "librockiva.so" \)
                    -print
                )
                ;;
            TV-3881T)
                # 881T：排除 librkllmrt.so 和 librockiva.so
                find_cmd+=(
                    \( -type f -o -type l \)
                    -a \( -name "lib*.so" -o -name "lib*.so.*" \)
                    -a -not -name "librkllmrt.so" -a -not -name "librockiva.so"
                    -print
                )
                ;;
            *)
                # 其它机型：保持原逻辑
                find_cmd+=(
                    \( -type f -o -type l \)
                    -a \( -name "lib*.so" -o -name "lib*.so.*" \)
                    -print
                )
                ;;
        esac

        # 执行查找和拷贝/链接操作
        "${find_cmd[@]}" | while IFS= read -r filepath; do
            filename=$(basename "$filepath")

            if [ -L "$filepath" ]; then
                # 保留软链接（不解引用）
                target=$(readlink "$filepath")
                ln -sf "$target" "$dst_dir/$filename"
            else
                cp "$filepath" "$dst_dir/$filename"
            fi
        done
        # 查找符合的文件（真实文件+软链接） -o -name "lib*.a"
        # find . -maxdepth 5 -type f \( -name "lib*.so" -o -name "lib*.so.*" \) -o -type l \( -name "lib*.so" -o -name "lib*.so.*" \) |
        # while read -r filepath; do
        #     filename="$(basename "$filepath")"

        #     # 如果是软链接，复制链接本身，不解引用
        #     if [ -L "$filepath" ]; then
        #         target="$(readlink "$filepath")"
        #         ln -svf "$target" "$dst_dir/$filename"
        #     else
        #         cp -v "$filepath" "$dst_dir/$filename"
        #     fi
        # done
    )
}

# 从 CMakeCache.txt 中读取变量值
cmake_cache_get() {
    local key=$1
    local cache_file=$2
    grep -o "^${key}:UNINITIALIZED=.*" "$cache_file" | cut -d'=' -f2
}
