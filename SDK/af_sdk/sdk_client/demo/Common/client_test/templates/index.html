<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDK Client 测试台</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#4f8cff;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;--cyan:#39c5cf;
  --mono:"Cascadia Code","Fira Code",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
::-webkit-scrollbar-track{background:transparent}
/* ===== 顶栏 ===== */
.topbar{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0}
.dot.dead{background:var(--red);box-shadow:0 0 6px var(--red)}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.topbar .sub{font-size:11px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.badge{font-size:11px;padding:2px 10px;border-radius:10px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.busy{color:var(--yellow);border-color:var(--yellow)}
.badge.dead{color:var(--red);border-color:var(--red)}
.qbtn{font-size:11px;padding:3px 10px;border-radius:5px;border:1px solid #6e3030;background:#2d1113;color:#ff8b87;cursor:pointer;white-space:nowrap}
.qbtn:hover{background:#4a1719;border-color:var(--red)}
/* ===== 主体 ===== */
.mainbody{flex:1;display:flex;min-height:0}
/* ===== 左侧命令面板 ===== */
.panel{width:392px;min-width:300px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel);flex-shrink:0}
.searchbar{display:flex;gap:6px;padding:10px 10px 6px}
.searchbar input{flex:1;background:#0d1117;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;outline:none}
.searchbar input:focus{border-color:var(--accent)}
.searchbar input::placeholder{color:#484f58}
.paneltools{display:flex;align-items:center;gap:10px;padding:0 10px 8px;font-size:11px;color:var(--muted)}
.paneltools a{color:var(--accent);cursor:pointer;text-decoration:none}
.paneltools a:hover{text-decoration:underline}
.paneltools .stat{margin-left:auto;font-family:var(--mono)}
.groups{flex:1;overflow-y:auto;padding:0 10px 10px}
.groups.locked .mbtn{pointer-events:none;opacity:.45}
/* 分组卡片 */
.group{margin-bottom:8px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);overflow:hidden}
.gtitle{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;user-select:none;font-size:12px;font-weight:600}
.gtitle:hover{background:#21262d}
.gtitle .bar{width:3px;height:13px;border-radius:2px;flex-shrink:0}
.gtitle .cnt{font-size:10px;color:var(--muted);font-weight:400;font-family:var(--mono)}
.gtitle .arr{margin-left:auto;color:var(--muted);transition:transform .15s;font-size:10px}
.group.closed .arr{transform:rotate(-90deg)}
.group.closed .gbtns{display:none}
.gbtns{display:flex;flex-wrap:wrap;gap:5px;padding:8px 9px 9px;border-top:1px solid var(--border)}
/* 命令按钮 */
.mbtn{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:12px;transition:border-color .12s,background .12s;white-space:nowrap}
.mbtn:hover{border-color:var(--accent);background:#20263a}
.mbtn:active{border-color:var(--accent);background:#27324d}
.mbtn .num{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:#161b22;padding:0 4px;border-radius:3px;min-width:24px;text-align:center}
.mbtn:hover .num{color:var(--accent)}
.mbtn.danger{border-color:#5c2b2b}
.mbtn.danger .num{color:#c97777}
.mbtn.danger:hover{border-color:var(--red);background:#251317}
/* 高亮命令按钮 (黄色标识, 如综合流程测试) */
.mbtn.hl{border-color:var(--yellow);background:#2a2410;color:#f0c674}
.mbtn.hl .num{color:var(--yellow);background:#3a3115}
.mbtn.hl:hover{border-color:#f0c674;background:#3a3115}
/* ===== 右侧终端区 ===== */
.right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.term-head{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0}
.term-head .tt{font-weight:600;color:var(--text);font-size:12px}
.term-head .tbtn{font-size:11px;padding:2px 10px;border-radius:5px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer}
.term-head .tbtn:hover{color:var(--text);border-color:var(--accent)}
.term-head .tbtn.on{color:var(--green);border-color:var(--green)}
.terminal{flex:1;overflow-y:auto;padding:10px 14px;background:#010409;font-family:var(--mono);font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:#c9d1d9}
.terminal .ln-user{color:var(--cyan)}
.terminal .ln-ok{color:var(--green)}
.terminal .ln-err{color:var(--red)}
.terminal .ln-sep{color:var(--yellow)}
.terminal .ln-sys{color:#79c0ff}
/* ===== 错误信息栏 ===== */
.errbar{display:none;align-items:center;gap:8px;padding:6px 14px;background:#2d1113;border-bottom:1px solid #5c2b2b;font-size:12px;flex-shrink:0}
.errbar.show{display:flex}
.errbar .errtag{color:var(--red);font-weight:600;white-space:nowrap}
.errbar .errcode{color:#ff8b87;font-family:var(--mono);white-space:nowrap}
.errbar .errmsg{color:#ffa198;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.errbar .errclose{background:none;border:none;color:#ff8b87;cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0}
.errbar .errclose:hover{color:#fff}
/* ===== 底部输入栏 ===== */
.inputbar{display:flex;gap:6px;padding:8px 14px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}
.inputbar input{flex:1;background:#0d1117;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;font-family:var(--mono);outline:none}
.inputbar input:focus{border-color:var(--accent)}
.ibtn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:#1f6feb;color:#fff;white-space:nowrap}
.ibtn:hover{background:#388bfd}
.ibtn.gray{background:#30363d;color:var(--text);font-weight:400}
.ibtn.gray:hover{background:#484f58}
</style>
</head>
<body>
<div class="topbar">
  <span class="dot" id="aliveDot"></span>
  <h1>SDK Client 测试台</h1>
  <span class="sub">嵌入式 HTTP 服务器</span>
  <span class="spacer"></span>
  <span class="badge" id="busyBadge">空闲</span>
  <button class="qbtn" onclick="exitDemo()">退出程序</button>
</div>
<div class="mainbody">
  <div class="panel">
    <div class="searchbar">
      <input id="search" placeholder="搜索命令: 编号或名称, 如 87 / 曝光" oninput="filterCmds()">
    </div>
    <div class="paneltools">
      <a onclick="setAllGroups(false)">全部展开</a>
      <a onclick="setAllGroups(true)">全部收起</a>
      <span class="stat" id="stat"></span>
    </div>
    <div class="groups" id="groups"></div>
  </div>
  <div class="right">
    <div class="term-head">
      <span class="tt">终端输出</span>
      <span class="spacer"></span>
      <button class="tbtn on" id="autoBtn" onclick="toggleAuto()">自动滚动: 开</button>
      <button class="tbtn" onclick="clearTerm()">清屏</button>
    </div>
    <div class="errbar" id="errbar">
      <span class="errtag">&#x26A0; 错误</span>
      <span class="errcode" id="errcode"></span>
      <span class="errmsg" id="errmsg"></span>
      <button class="errclose" onclick="clearErr()" title="关闭">&#x2715;</button>
    </div>
    <div class="terminal" id="term"></div>
    <div class="inputbar">
      <input id="ci" placeholder="参数输入 (回车=发送, ↑↓=历史, quit=中止, clear=清屏)">
      <button class="ibtn" onclick="sendInput()">发送</button>
      <button class="ibtn gray" onclick="quickInput('quit')">quit</button>
      <button class="ibtn gray" onclick="quickInput('clear')">clear</button>
    </div>
  </div>
</div>

};

/* ===================== 状态 ===================== */
let pos=0,timer=null,autoScroll=true,stickBottom=true;
let inputHist=[],histIdx=-1;
let pendingCmd=null;  /* 高危命令回车确认暂存 */
const LS_KEY="sdkdemo.collapsed";

/* ===================== 构建命令面板 ===================== */
function buildUI(){
  let h="";
  for(let gi=0;gi<G.length;gi++){
    const g=G[gi];
    h+='<div class="group" id="grp'+gi+'">'
      +'<div class="gtitle" onclick="toggleGroup('+gi+')">'
      +'<span class="bar" style="background:'+g.c+'"></span>'
      +'<span>'+g.t+'</span><span class="cnt">'+g.i.length+'</span>'
      +'<span class="arr">&#9662;</span></div>'
      +'<div class="gbtns">';
    for(const[n,l]of g.i){
      const ex=EXAMPLE[n];
      h+='<button class="mbtn'+(DANGER.has(n)?" danger":"")+(HILITE.has(n)?" hl":"")+'" data-n="'+n+'" data-l="'+l+'"'
        +(ex?' title="示例: '+ex.replace(/"/g,"&quot;")+'"':"")
        +' onclick="cmd('+n+')">'
        +'<span class="num">'+n+'</span><span>'+l+'</span>'
        +'</button>';
    }
    h+='</div></div>';
  }
  document.getElementById("groups").innerHTML=h;
  restoreCollapse();
  updateStat(TOTAL);
}
/* 折叠状态存 localStorage */
function toggleGroup(gi){
  const el=document.getElementById("grp"+gi);
  el.classList.toggle("closed");
  saveCollapse();
}
function setAllGroups(closed){
  for(let gi=0;gi<G.length;gi++)
    document.getElementById("grp"+gi).classList.toggle("closed",closed);
  saveCollapse();
}
function saveCollapse(){
  const st=[];
  for(let gi=0;gi<G.length;gi++)
    if(document.getElementById("grp"+gi).classList.contains("closed"))st.push(gi);
  try{localStorage.setItem(LS_KEY,JSON.stringify(st));}catch(e){}
}
function restoreCollapse(){
  let st=[];
  try{st=JSON.parse(localStorage.getItem(LS_KEY)||"[]");}catch(e){}
  st.forEach(gi=>{
    const el=document.getElementById("grp"+gi);
    if(el)el.classList.add("closed");
  });
}
/* ===================== 搜索过滤 ===================== */
function filterCmds(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const btns=document.querySelectorAll(".mbtn");
  let shown=0;
  btns.forEach(b=>{
    const hit=!q||b.dataset.n.indexOf(q)>=0||b.dataset.l.toLowerCase().indexOf(q)>=0;
    b.style.display=hit?"":"none";
    if(hit)shown++;
  });
  /* 有搜索词时: 展开含匹配项的分组并显示; 无搜索词时: 恢复折叠状态 */
  const searching=q.length>0;
  for(let gi=0;gi<G.length;gi++){
    const el=document.getElementById("grp"+gi);
    const any=[...el.querySelectorAll(".mbtn")].some(b=>b.style.display!=="none");
    el.style.display=any?"":"none";
    if(searching)el.classList.remove("closed");
  }
  if(!searching)restoreCollapse();
  updateStat(shown);
}
function updateStat(n){
  document.getElementById("stat").textContent=n+"/"+TOTAL+" 项";
}
/* ===================== 命令执行 ===================== */
async function cmd(n){
  followBottom();
  if(DANGER.has(n)){
    pendingCmd=n;
    appendLine("⚠ 命令 "+n+" 为高危操作, 回车确认执行 (或输入 quit 取消)\n","ln-sep");
    /* 高危且需 JSON 输入的命令(如42网络设置/110恢复默认): 仍预填示例,
     * 确认执行后会阻塞等待终端输入, 示例保留在输入框供下一步直接回车发送 */
    if(EXAMPLE[n]){
      const ci=document.getElementById("ci");
      ci.value=EXAMPLE[n];
      ci.focus();
      appendLine("ℹ 已预填示例 JSON, 回车确认执行; 终端等待输入时, 可修改后再次回车发送:\n  "+EXAMPLE[n]+"\n","ln-sys");
    }
    return;
  }
  appendLine("> 命令: "+n+"\n","ln-user");
  const r=await fetch("/api/cmd",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cmd:n})});
  const d=await r.json();
  if(d.busy){appendLine("> "+d.msg+"\n","ln-sys");return;}
  /* 需要 JSON 输入的命令: 有示例则预填到输入框并聚焦, 无示例则提示等待终端打印当前配置后填入 */
  if(EXAMPLE[n]){
    const ci=document.getElementById("ci");
    ci.value=EXAMPLE[n];
    ci.focus();
    appendLine("ℹ 命令 "+n+" 需要 JSON 输入, 已预填示例, 直接回车发送或改为实际值:\n  "+EXAMPLE[n]+"\n","ln-sys");
  }else if(NEEDS_INPUT.has(n)){
    document.getElementById("ci").focus();
    appendLine("ℹ 命令 "+n+" 需要 JSON 输入, 待终端打印「等待输入Json数据」后, 在下方输入框填入 JSON 并回车 (空行=默认值)\n","ln-sys");
  }
  startPoll();
}
async function exitDemo(){
  await fetch("/api/cmd",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cmd:999})});
  appendLine("> 已发送退出命令 (999)\n","ln-sys");
}
/* ===================== 参数输入 ===================== */
/* 主动发送(回车/发送按钮)代表用户想看到最新输出: 恢复贴底并立即滚到底部
 * (仍尊重"自动滚动"总开关; 用户上翻导致 stickBottom=false 的状态由此解除) */
function followBottom(){
  if(!autoScroll)return;
  stickBottom=true;
  const el=document.getElementById("term");
  el.scrollTop=el.scrollHeight;
}
async function sendInput(){
  const el=document.getElementById("ci"),v=el.value;
  pushHist(v);
  followBottom();
  /* 高危命令确认: 如果有暂存的高危命令, 回车=执行, quit=取消 */
  if(pendingCmd!==null){
    if(v.trim()==="quit"){
      appendLine("> 已取消命令 "+pendingCmd+"\n","ln-sys");
      pendingCmd=null;
      el.value="";
      return;
    }
    const n=pendingCmd;
    pendingCmd=null;
    appendLine("> 确认执行命令: "+n+"\n","ln-user");
    const r=await fetch("/api/cmd",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cmd:n})});
    const d=await r.json();
    if(d.busy){appendLine("> "+d.msg+"\n","ln-sys");return;}
    startPoll();
    /* 带 JSON 示例的高危命令(42/107/110等)确认后保留输入框, 供终端「等待输入Json数据」时直接回车发送;
     * 无示例的高危命令确认后清空输入框, 避免残留历史文本 */
    if(!EXAMPLE[n]) el.value="";
    return;
  }
  el.value="";
  await postInput(v);
}
async function quickInput(v){
  pushHist(v);
  followBottom();
  await postInput(v);
}
async function postInput(v){
  appendLine("> 输入: "+(v===""?"(空行, 使用默认值)":v)+"\n","ln-user");
  await fetch("/api/input",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:v})});
  startPoll();
}
function pushHist(v){
  if(!v)return;
  if(inputHist[inputHist.length-1]!==v)inputHist.push(v);
  if(inputHist.length>50)inputHist.shift();
  histIdx=inputHist.length;
}
/* 键盘事件: 回车发送(焦点在终端等非编辑区域同样生效), 输入框内上下键回溯历史 */
document.addEventListener("keydown",e=>{
  const tag=e.target.tagName,inCi=e.target.id==="ci";
  if(e.key==="Enter"){
    /* 中文输入法组词(isComposing/keyCode 229)过程中的回车只确认候选词, 不发送 */
    if(e.isComposing||e.keyCode===229)return;
    /* 搜索框等其他可编辑控件的回车不触发命令; 按钮/链接保留原生回车激活, 避免重复发送 */
    const editable=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||e.target.isContentEditable;
    if((editable&&!inCi)||tag==="BUTTON"||tag==="A")return;
    e.preventDefault();
    if(!inCi)document.getElementById("ci").focus();
    sendInput();
  }else if(inCi&&e.key==="ArrowUp"){
    if(histIdx>0){histIdx--;e.target.value=inputHist[histIdx]||"";}
    e.preventDefault();
  }else if(inCi&&e.key==="ArrowDown"){
    if(histIdx<inputHist.length-1){histIdx++;e.target.value=inputHist[histIdx]||"";}
    else{histIdx=inputHist.length;e.target.value="";}
    e.preventDefault();
  }
});
/* ===================== 输出轮询 ===================== */
function startPoll(){if(!timer)timer=setInterval(poll,400);}
async function poll(){
  try{
    const r=await fetch("/api/output?pos="+pos);
    const d=await r.json();
    if(d.data){
      const ci=d.data.indexOf("[CLEAR]");
      if(ci>=0){
        document.getElementById("term").innerHTML="";
        const after=d.data.substring(ci+7);
        if(after)appendText(after);
      }else{
        appendText(d.data);
      }
    }
    pos=d.pos;
  }catch(e){}
}
/* ===================== 终端渲染 ===================== */
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
/* 常见 SDK 错误码中文描述 */
const ERR_MAP={
  "-1":"操作失败","3":"用户未授权","5":"用户不存在/密码错误",
  "102":"参数无效","104":"句柄无效","112":"命令不支持",
  "113":"设备/通道不支持","114":"超时","115":"消息不匹配",
  "200":"创建连接失败","201":"发送消息失败","202":"解析响应失败",
  "203":"功能未实现","204":"JSON解析错误"
};
function lineClass(s){
  if(s.indexOf("> ")===0)return"ln-user";
  if(s.indexOf("---")===0)return"ln-sep";
  if(s.indexOf("失败")>=0)return"ln-err";
  if(s.indexOf("成功")>=0)return"ln-ok";
  if(s.indexOf("已就绪")>=0||s.indexOf("用法")>=0)return"ln-sys";
  return"";
}
/* 检测输出中的错误并更新错误栏 */
function detectError(s){
  var m=s.match(/Error=(-?\d+).*Msg=(.+)/);
  if(!m) m=s.match(/error=(-?\d+)/i);
  if(m){
    var code=m[1],msg=m[2]||ERR_MAP[code]||"";
    var desc=ERR_MAP[code]||"";
    document.getElementById("errcode").textContent="Error="+code+(desc?" ("+desc+")":"");
    document.getElementById("errmsg").textContent=msg||desc||"操作失败";
    document.getElementById("errbar").classList.add("show");
  }else if(s.indexOf("失败")>=0&&s.indexOf("Error=")<0){
    document.getElementById("errcode").textContent="";
    document.getElementById("errmsg").textContent=s.trim();
    document.getElementById("errbar").classList.add("show");
  }
}
function clearErr(){
  document.getElementById("errbar").classList.remove("show");
}
/* 增量文本按行着色追加; 行数超限裁剪头部防卡顿 */
function appendText(t){
  const lines=t.split("\n");
  let html="";
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];
    if(i<lines.length-1){
      const cls=lineClass(ln);
      html+=cls?('<span class="'+cls+'">'+esc(ln)+"</span>\n"):esc(ln)+"\n";
      if(cls==="ln-err")detectError(ln);
    }else if(ln)html+=esc(ln);
  }
  appendHtml(html);
}
function appendLine(t,cls){
  appendHtml('<span class="'+cls+'">'+esc(t)+"</span>");
}
function appendHtml(html){
  const el=document.getElementById("term");
  const div=document.createElement("div");
  div.innerHTML=html;
  while(div.firstChild)el.appendChild(div.firstChild);
  /* 限制最大行数: 超出 4000 行裁掉头部 800 行 */
  while(el.childNodes.length>4000)el.removeChild(el.firstChild);
  if(autoScroll&&stickBottom)el.scrollTop=el.scrollHeight;
}
/* 滚动贴底检测: 用户上滚时暂停自动滚动, 滚回底部恢复 */
document.getElementById("term").addEventListener("scroll",function(){
  const el=this;
  stickBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40;
});
function toggleAuto(){
  autoScroll=!autoScroll;
  const b=document.getElementById("autoBtn");
  b.textContent="自动滚动: "+(autoScroll?"开":"关");
  b.classList.toggle("on",autoScroll);
  if(autoScroll){
    stickBottom=true;
    const el=document.getElementById("term");
    el.scrollTop=el.scrollHeight;
  }
}
function clearTerm(){
  document.getElementById("term").innerHTML="";
  appendLine("> 已清空显示 (输出缓冲区位置不变)\n","ln-sys");
}
/* ===================== 状态轮询 (busy/存活) ===================== */
function setBusy(b){
  const el=document.getElementById("busyBadge");
  el.textContent=b?"测试中":"空闲";
  el.className="badge"+(b?" busy":"");
  document.getElementById("groups").classList.toggle("locked",b);
}
function setAlive(a){
  document.getElementById("aliveDot").classList.toggle("dead",!a);
}
setInterval(async()=>{
  try{
    const r=await fetch("/api/status");
    const d=await r.json();
    setBusy(!!d.busy);
    setAlive(true);
  }catch(e){setAlive(false);}
},1000);
/* ===================== 启动 ===================== */
buildUI();
appendLine("SDK Client 测试台已就绪\n","ln-sys");
appendLine("共 "+TOTAL+" 项命令, 按功能分为 "+G.length+" 组; 左侧搜索框可按编号/名称过滤\n点击后输入框会自动预填示例(有示例时)或提示填法\n参数输入框: 命令等待输入时提交(JSON 或通道号数字, 空行=默认值); quit=中止当前测试, clear=清屏, ↑↓=历史\n","ln-sys");
startPoll();
</script>
