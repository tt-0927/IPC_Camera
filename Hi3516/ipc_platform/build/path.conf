# ============================================================
# 函数：将版本号从 V<major>.<minor>.<patch> 转换为软著格式 V<major>.<minor><patch>
# 参数：$1 - 原始版本号（如 V1.0.4）
# 输出：转换后的版本号（如 V1.04）
# 说明：去掉 minor 和 patch 之间的点号，用于软著打包
# ============================================================
convert_to_copyright_version() {
    local ver="$1"
    echo "$ver" | sed 's/\(V[0-9]*\.[0-9]*\)\.\([0-9]*\)/\1\2/'
}

