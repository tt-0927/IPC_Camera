# path.conf 脚本环境配置文件

# 获取配置文件所在目录
BUILD_ROOT_PATH=$(dirname "$(realpath "${BASH_SOURCE[0]}")")

# 加载 log.conf 配置文件
source "$BUILD_ROOT_PATH/log.conf"
# 设置项目根目录
PROJECT_ROOT_PATH="$BUILD_ROOT_PATH/../.."
# git仓库目录
GIT_ROOT_PATH="$BUILD_ROOT_PATH/../../hi3516_ipc"
# 设置顶层CMakelist.txt所在路径
SRC_ROOT_PATH="$BUILD_ROOT_PATH/../../hi3516_ipc"
#临时文件输出路径
OUTPUT_DIR_NAME=$BUILD_ROOT_PATH/../../output
#cmake临时文件输出路径
CMAKE_TEMP_PATH=$OUTPUT_DIR_NAME/cmake_temp
# 自动摆渡文件
AUTO_FILE="$BUILD_ROOT_PATH/compile.sh"

# 输出路径
BIN_PATH=$OUTPUT_DIR_NAME/bin
STRIP_BIN_PATH=$OUTPUT_DIR_NAME/bin_strip
PACK_BIN_PATH=$OUTPUT_DIR_NAME/packet
IMAGE_BIN_PATH=$OUTPUT_DIR_NAME/image

# 设置cmake默认编译类型，打升级包、镜像都固定编译Release版本
BUILD_TYPE="-DBUILD_VERSION=Release"

# 设置版本文件路径
GIT_VERSION_FILE=$SRC_ROOT_PATH/include/git_version.h
# 版本号
GIT_VERSION=$(git -C "$GIT_ROOT_PATH" describe --dirty --always)

# 记录本地型号文件
LOCAL_DEVICE_FILE="$BUILD_ROOT_PATH/device.txt"
# 从本地型号文件读取型号
if [ -f "$LOCAL_DEVICE_FILE" ]; then
    DEVICE_TYPE=$(cat "$LOCAL_DEVICE_FILE")
else
    DEVICE_TYPE=""
fi
# 定义支持的设备类型数组
DEVICE_TYPES=("TV-3852T" "TV-3852H" "TV-3852TL" "TV-3852HL" "TV-3852TL4G" "TV-3852TLW" "TV-3852HZT")

# 检查设备类型是否有效的函数
check_device_type() {
    local device_type=$1

    if [[ " ${DEVICE_TYPES[@]} " =~ " $device_type " ]]; then
        info "当前设备型号: $device_type" $LINENO
    else
        error "不支持的设备型号: $device_type, 请重新输入" $LINENO
        return 1
    fi
}

# 设置设备类型的函数
set_device_type() {
    local device_type=$1

    # 使用 [[ ... ]] 结构和数组包含性检查
    if [[ " ${DEVICE_TYPES[@]} " =~ " $device_type " ]]; then
        # 重定向并重载型号到本地文件
        echo $device_type >$LOCAL_DEVICE_FILE
        DEVICE_TYPE=$device_type
        info "============> 设置设备型号：$device_type <============" $LINENO
        return 0
    else
        error "不支持的设备型号: $device_type ,请重新输入" $LINENO
        return 1
    fi
}

# 检查设备类型是否有效的函数
check_device_file() {
    # 判断是否存在本地设备型号文件
    if [ ! -f "$LOCAL_DEVICE_FILE" ]; then
        # 不存在需提示创建
        error "请先确定当前构建的设备型号, eg: ./build.sh -d 设备型号 " $LINENO
        return 1
    fi
}

# 打印所有支持的设备型号
list_device_types() {
    info "============> 支持的设备型号列表 <============"

    local i=1
    for dev in "${DEVICE_TYPES[@]}"; do
        echo "  [$i] $dev"
        i=$((i + 1))
    done
}

