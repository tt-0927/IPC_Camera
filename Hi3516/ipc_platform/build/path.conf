# ============================================================
# 版本号自动提取
# 说明：从 share_define.h 中根据当前设备型号自动获取系统版本号，
#       支持追加日期序号后缀用于小迭代构建。
# ============================================================

# share_define.h 头文件路径
SHARE_DEFINE_H="$SRC_ROOT_PATH/include/share_define.h"

# 构建序号文件路径（记录当天构建次数）
BUILD_COUNT_FILE="$BUILD_ROOT_PATH/build_count.txt"

# ============================================================
# 函数：从 share_define.h 中提取指定设备宏对应的系统版本号
# 参数：$1 - 设备型号（如 TV-3852TLW）
# 返回：版本号字符串（如 V1.0.4），失败时返回空
# 说明：
#   1. 设备型号到编译宏的映射规则：TV-XXXX → DEVICE_TV_XXXX
#   2. 支持 OR 条件分支（如 DEVICE_TV_3852H || DEVICE_TV_3852HZT）
#   3. 未匹配到任何分支时，返回 #else 默认分支的版本号
# ============================================================
get_version_from_share_define() {
    local device_type=$1
    # 设备型号中的连字符 - 需转换为下划线 _，以匹配 C 宏命名（TV-3852TLW → DEVICE_TV_3852TLW）
    local device_macro="DEVICE_${device_type//-/_}"
    local share_define="$SHARE_DEFINE_H"

    if [ ! -f "$share_define" ]; then
        error "share_define.h 不存在: $share_define"
        return 1
    fi

    # 使用 awk 解析 #if / #elif defined() 分支，提取匹配分支的 DEVICE_PROFILE_SYSTEM_VERSION
    local version
    version=$(awk -v macro="$device_macro" '
    BEGIN {
        matched = 0      # 是否找到匹配的分支
        in_match = 0     # 当前是否在匹配的分支内
        default_ver = "" # #else 默认分支的版本号
    }

    # 匹配 #if defined(XXX) 或 #elif defined(XXX)，支持 || 连接多个 defined()
    /^[[:space:]]*#(if|elif)[[:space:]]+defined\(/ {
        # 检查当前行是否包含目标宏（支持 OR 条件）
        if (index($0, "defined(" macro ")") > 0) {
            in_match = 1
            matched = 1
        } else {
            in_match = 0
        }
        next
    }

    # 匹配 #else 分支
    /^[[:space:]]*#else/ {
        in_match = 2  # 标记为默认分支
        next
    }

    # 匹配 #endif，重置分支状态
    /^[[:space:]]*#endif/ {
        in_match = 0
        next
    }

    # 在匹配分支或默认分支中提取 DEVICE_PROFILE_SYSTEM_VERSION
    /DEVICE_PROFILE_SYSTEM_VERSION/ {
        if (in_match == 1) {
            # 优先使用匹配分支的版本号
            gsub(/.*DEVICE_PROFILE_SYSTEM_VERSION[[:space:]]+/, "")
            gsub(/"/, "")
            print
            exit
        } else if (in_match == 2) {
            # 暂存默认分支版本号
            gsub(/.*DEVICE_PROFILE_SYSTEM_VERSION[[:space:]]+/, "")
            gsub(/"/, "")
            default_ver = $0
        }
    }

    END {
        # 未匹配到任何分支时，输出默认版本号
        if (!matched && default_ver != "") {
            print default_ver
        }
    }
    ' "$share_define")

    if [ -z "$version" ]; then
        error "无法从 share_define.h 提取设备 $device_type (宏: $device_macro) 的版本号"
        return 1
    fi

    echo "$version"
    return 0
}

# ============================================================
# 函数：生成当天构建序号（3 位，每日归零）
# 返回：序号字符串（如 001、002）
# 说明：使用本地文件 BUILD_COUNT_FILE 记录日期和序号，
#       日期变化时自动归零为 001
# ============================================================
get_build_suffix() {
    local today
    today=$(date +%Y%m%d)
    local count=1

    if [ -f "$BUILD_COUNT_FILE" ]; then
        local last_date last_count
        last_date=$(head -1 "$BUILD_COUNT_FILE")
        last_count=$(tail -1 "$BUILD_COUNT_FILE")

        if [ "$last_date" = "$today" ]; then
            count=$((last_count + 1))
        fi
    fi

    # 写入当天日期和最新序号
    printf "%s\n%s\n" "$today" "$count" > "$BUILD_COUNT_FILE"

    # 输出 3 位零填充序号
    printf "%03d" "$count"
}

# ============================================================
# 函数：解析版本号（自动提取 + 可选后缀）
# 参数：$1 - 是否追加日期后缀（true/false）
#        $2 - 是否启用软著模式（true/false），可选，默认 false
# 说明：
#   1. 从 share_define.h 获取当前设备型号的基线版本号
#   2. 若 $1 为 true，追加 -YYYYMMDDNNN 后缀
#   3. 若 $2 为 true，转换为软著版本格式（如 V1.0.4 → V1.04），忽略 daily 后缀
#   4. 结果写入全局变量 VERSION_NUM
# ============================================================
resolve_version() {
    local append_daily=$1
    local copyright_mode=${2:-false}
    local base_version

    base_version=$(get_version_from_share_define "$DEVICE_TYPE")
    if [ $? -ne 0 ] || [ -z "$base_version" ]; then
        return 1
    fi

    if [ "$copyright_mode" = "true" ]; then
        # 软著模式：转换版本号格式，不追加日期后缀
        VERSION_NUM=$(convert_to_copyright_version "$base_version")
    elif [ "$append_daily" = "true" ]; then
        local suffix today_str
        suffix=$(get_build_suffix)
        today_str=$(date +%Y%m%d)
        VERSION_NUM="${base_version}-${today_str}${suffix}"
    else
        VERSION_NUM="$base_version"
    fi

    info "============> 从 share_define.h 自动获取版本号: $VERSION_NUM (设备: $DEVICE_TYPE) <============"
    return 0
}

# 设置版本号
# 定义一个数组，包含需要移除的字符串
# remove_array=("_TV-6204K" "_tv-6204k" "_TV-6124HU" "_tv-6124hu")
set_version() {
    info "============> 当前git版本号 $GIT_VERSION <============"
    #生成版本头文件
    echo '#ifndef _GIT_VERSION_H' >$GIT_VERSION_FILE
    echo "#define _GIT_VERSION_H" >>$GIT_VERSION_FILE
    echo "#define _VERSION \""$GIT_VERSION"\"" >>$GIT_VERSION_FILE
    echo '#endif' >>$GIT_VERSION_FILE
    sync
    info "成功生成版本头文件$GIT_VERSION_FILE"

    # 版本号
    VERSION_NUM=$GIT_VERSION
    # 使用循环移除所有的字符串
    for i in "${remove_array[@]}"; do
        VERSION_NUM=${VERSION_NUM//$i/}
    done
    info "============> 当前软件版本号 $VERSION_NUM <============"
}

# 拷贝第三方库文件
copy_third_party_libs() {
    local src_dir="$1"
    local dst_dir="$2"

    # 要排除的相对子目录路径（相对于 $src_dir）
    local EXCLUDE_DIRS=("faac" "fdk-aac" "gmssl" "MemoryCheck" "HCNetSDK" "opencv" "opencvfont" "rtmp" "srt" "twolame" "x264" "x265" "ZLMediaKit") #"fdk-aac" "ffmpeg"

    if [ ! -d "$src_dir" ]; then
        error "源目录不存在：$src_dir"
        return 1
    fi

    mkdir -p "$dst_dir"

    # 进入源目录，处理匹配的库文件（包括软链接）
    (
        cd "$src_dir" || exit 1

        # 构建 find 命令参数
        local find_cmd=(find .)

        for dir in "${EXCLUDE_DIRS[@]}"; do
            find_cmd+=(-path "./$dir" -prune -o)
        done

        # 添加主查找逻辑：匹配库文件（普通文件或符号链接）  -o -name "lib*.a"
        find_cmd+=(
            \( -type f -a \( -name "lib*.so" -o -name "lib*.so.*" \) \
            -o -type l -a \( -name "lib*.so" -o -name "lib*.so.*" \) \)
            -print
        )

        # 执行查找和拷贝操作
        "${find_cmd[@]}" | while read -r filepath; do
            filename="$(basename "$filepath")"

            if [ -L "$filepath" ]; then
                # 保留软链接（不解引用）
                target="$(readlink "$filepath")"
                ln -sf "$target" "$dst_dir/$filename"
            else
                cp "$filepath" "$dst_dir/$filename"
            fi
        done
        # 查找符合的文件（真实文件+软链接） -o -name "lib*.a"
        # find . -maxdepth 5 -type f \( -name "lib*.so" -o -name "lib*.so.*" \) -o -type l \( -name "lib*.so" -o -name "lib*.so.*" \) |
        # while read -r filepath; do
        #     filename="$(basename "$filepath")"

        #     # 如果是软链接，复制链接本身，不解引用
        #     if [ -L "$filepath" ]; then
        #         target="$(readlink "$filepath")"
        #         ln -svf "$target" "$dst_dir/$filename"
        #     else
        #         cp -v "$filepath" "$dst_dir/$filename"
        #     fi
        # done
    )
}

# 从 CMakeCache.txt 中读取变量值
cmake_cache_get() {
    local key=$1
    local cache_file=$2
    grep -o "^${key}:UNINITIALIZED=.*" "$cache_file" | cut -d'=' -f2
}
