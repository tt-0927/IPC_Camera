# help.conf

# 获取配置文件所在目录
HELP_PATH=$(dirname "$(realpath "${BASH_SOURCE[0]}")")

# 加载 log.conf 配置文件
source "$HELP_PATH/log.conf"

# 帮助信息函数
display_help() {
    info "帮助说明: "
    info "用法: $0 [选项]"
    info "选项:"
    info "-d <设备型号>         设置设备型号(TV-3852T/TV-3852H)"
    info "-s <镜头型号>         设置镜头型号(sc500ai-f4mm)"
    info "-m <程序名>           编译单个目标程序"
    info "-b <构建模式>         设置构建模式(例如, Debug、Release)(默认：Release)"
    info "-b <构建模式>         设置构建模式(Debug、Release、RelWithDebInfo)(默认：Release)"
    info "-t <升级包类型>       指定编译升级包的类型(例如, all、lib)(默认：all)"
    info "-a                    编译所有目标程序"
    info "-p                    编译升级包"
    info "-i                    编译固件包"
    info "-v                    指定版本号"
    info "-c                    清理所有临时文件与目录"
    info "--autofile            自动摆渡文件"
    info "--all-focal           打包当前设备型号支持的所有焦距(根据设备焦距映射表自动展开)"
    info "--all-project         打包所有项目类型(itc、中性)"
    info "--daily               追加日期序号后缀(小迭代构建, 如 V1.0.4-20260804001)"
    info "--copyright           软著模式：输出文件名用软著名称包裹，版本号转为V1.04格式（无日期）"
    info "-h                    显示此帮助信息"
    info ""
    info "示例："
    info "设置设备型号："
    trace "  ./build.sh -d TV-3852T"
    trace "  ./build.sh -d TV-3852H"
    info "设置镜头型号："
    trace "  ./build.sh -s sc500ai-f4mm"
    info "编译stream程序："
    trace "  ./build.sh -m stream"
    info "编译stream程序 自动摆渡stream程序："
    trace "  ./build.sh -m stream --autofile"
    info "编译所有目标程序 自动摆渡所有目标程序："
    trace "  ./build.sh -a --autofile"
    info "编译所有目标程序 设置构建模式为Debug："
    trace "  ./build.sh -a -b Debug"
    info "编译带独立符号文件、但保持Release优化的stream程序："
    trace "  ./build.sh -m stream -b RelWithDebInfo"
    info "编译升级包（自动从 share_define.h 获取版本号）："
    trace "  ./build.sh -p"
    info "编译升级包（自动获取版本号 + 日期序号后缀）："
    trace "  ./build.sh -p --daily"
    info "编译升级包（手动指定版本号）："
    trace "  ./build.sh -p -v V1.0.1"
    info "编译升级包 设置构建模式为Debug："
    trace "  ./build.sh -p -v V1.0.1 -b Debug"
    info "编译升级包 设置构建模式为Debug 指定编译升级包的类型为lib："
    trace "  ./build.sh -p -v V1.0.1 -b Debug -t lib"
    info "编译升级包 自动摆渡升级包："
    trace "  ./build.sh -p -v V1.0.1 --autofile"
    info "编译升级包 打包当前sc533hai镜头型号下的所有焦距："
    trace "  ./build.sh -p -v V1.0.1 --all-focal"
    info "编译升级包 打包所有sc533hai焦距和所有项目类型："
    trace "  ./build.sh -p -v V1.0.1 --all-focal --all-project"
    info "编译固件包（自动从 share_define.h 获取版本号）："
    trace "  ./build.sh -i"
    info "编译固件包（自动获取版本号 + 日期序号后缀）："
    trace "  ./build.sh -i --daily"
    info "编译固件包（手动指定版本号）："
    trace "  ./build.sh -i -v V1.0.1"
    info "编译固件包 设置构建模式为Debug："
    trace "  ./build.sh -i -v V1.0.1 -b Debug"
    info "编译固件包 设置构建模式为Debug 指定先编译的升级包的类型为lib："
    trace "  ./build.sh -i -v V1.0.1 -b Debug -t lib"
    info "编译固件包 自动摆渡升级包、固件包："
    trace "  ./build.sh -i -v V1.0.1 --autofile"
    info "编译固件包 打包所有sc533hai焦距和所有项目类型："
    trace "  ./build.sh -i -v V1.0.1 --all-focal --all-project"
    info "编译升级包（软著模式）："
    trace "  ./build.sh -p --copyright"
    info "编译固件包（软著模式）："
    trace "  ./build.sh -i --copyright"
}

# 显示当前配置信息
display_current_config() {
    info ""
    info "============> 当前配置信息 <============"

    # 显示设备型号
    if [ -f "$LOCAL_DEVICE_FILE" ]; then
        local current_device=$(cat "$LOCAL_DEVICE_FILE")
        info "设备型号: $current_device"
    else
        info "设备型号: (未设置)"
    fi

    # 显示镜头型号
    if [ -f "$LOCAL_SENSOR_FILE" ]; then
        local current_sensor=$(cat "$LOCAL_SENSOR_FILE")
        info "镜头型号: $current_sensor"
    else
        info "镜头型号: (未设置)"
    fi

    # 显示项目类型
    if [ -f "$LOCAL_PROJECT_FILE" ]; then
        local current_project=$(cat "$LOCAL_PROJECT_FILE")
        info "项目类型: $current_project"
    else
        info "项目类型: (未设置)"
    fi

    info "========================================"
}
