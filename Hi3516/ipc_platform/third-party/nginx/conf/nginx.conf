# --------------------http点播--------------------
http {
    include       ip_filter.conf;
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    client_body_timeout 10;
    reset_timedout_connection on;
    send_timeout 10;
    client_max_body_size 2047M;
    # limit_conn_zone $binary_remote_addr zone=addr:10m;
    # limit_conn addr 20;
    # limit_rate 4m;
    charset UTF-8;
    gzip on;
    gzip_proxied any;
    # gzip_min_length 1024;
    gzip_comp_level 6;

    open_file_cache max=100000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;

    open_file_cache_errors on;

    access_log off;
    # access_log /opt/course/log/nginx/replayaccess.log;

    sendfile off;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 10;

    # cache
    # proxy_connect_timeout 5;
    # proxy_read_timeout 60;
    # proxy_send_timeout 5;
    # proxy_buffer_size 16k;
    # proxy_buffers 4 64k;
    # proxy_busy_buffers_size 128k;
    # proxy_temp_file_write_size 128k;
    # proxy_temp_path /opt/dvr_rdk/ti816x_2.8/nginx/cache_temp/temp;
    # proxy_cache_path /opt/dvr_rdk/ti816x_2.8/nginx/cache_temp/cache levels=1:2 keys_zone=cache_one:20m inactive=1d max_size=20g;
    # cache end

    server 
    {
        listen 80; # http port
        listen [::]:80; # http port
        server_name http.server.com; 

        location / {
            proxy_pass http://0.0.0.0:18888/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /onvif/ {
            proxy_pass http://0.0.0.0:58080/onvif/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Connection "";  

            proxy_pass_request_headers on;

            proxy_buffering off;
        }
    }

    # HTTP server
    server {
       listen 18888;#内部自定义端口不可变
        server_name 0.0.0.0;  

        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';  

        # 确保客户端只能通过 HTTPS 访问
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 添加 Content-Security-Policy 头，限制资源加载来源
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; script-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; font-src 'self' data:; img-src 'self' data:; media-src 'self' blob:;" always;

        # 添加 X-Content-Type-Options 头，防止 MIME 类型嗅探
        add_header X-Content-Type-Options "nosniff" always;

        # 添加 X-Frame-Options 头，防止点击劫持，使用 SAMEORIGIN 来允许同源访问
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 添加 X-XSS-Protection 头，防止 XSS 攻击
        add_header X-XSS-Protection "1; mode=block" always;

        # 添加 X-Permitted-Cross-Domain-Policies 头，阻止跨域策略文件被加载
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # 添加 X-Download-Options 头，防止文件被下载时自动打开
        add_header X-Download-Options "noopen" always;

        # 添加 Referrer-Policy 头，限制引荐来源的披露
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /var/www/html;
        index index.html index.htm;

        expires 1h;
        # charset koi8-r;
        # access_log logs/host.access.log main;

        # 用于AI背景显示背景图片
        # location ~* \.(jpg|jpeg|png)$ {
        #     root /userdata; #pictures
        #     autoindex off;
        # }

        # location /live {
        #     flv_live on;
        #     chunked_transfer_encoding on;
        # }

        # location ~/aaaa.flv {
        #     add_header Cache-Control no-cache;
        #     add_header Access-Control-Allow-Origin *;
        #     proxy_pass http://127.0.0.1:6060;
        # }

        location ~* ^.+.(bmp|jpg|jpeg|gif|css|png|js|ico|xml|html|swf|flash|media|woff|map)$ {
            access_log off;
            expires 30d;
        }

        # location ~ .flv {
        #     proxy_cache_valid 200 302 1h;
        #     proxy_cache_valid 301 1d;
        #     proxy_cache_valid any 10m;
        #     expires 1d;
        #     proxy_cache_key $host$uri$is_args$args;
        #     flv;
        # }

        # location ~ .mp4 {
        #     add_header 'Content-Type' 'application/octet-stream';
        #     proxy_cache_valid 200 302 1h;
        #     proxy_cache_valid 301 1d; 
        #     proxy_cache_valid any 10m;
        #     expires 1d;
        #     proxy_cache_key $host$uri$is_args$args;
        #     mp4;
        # }

        # location /stat {
        #     rtmp_stat all;
        #     allow 127.0.0.1;
        # }

        location / {
            root /var/www/html;
            index index.html index.htm;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';

            # 禁用缓存,防止通过http获取文件内容不是最新的
            add_header Cache-Control no-store;
            add_header Pragma no-cache;
            # 过期时间设置为负值，表示已过期
            expires -1;
        }

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /opt/course;
        }

        location ~ \.cgi$ {
            # proxy_pass http://127.0.0.1
            # root/cgi;
            fastcgi_pass  127.0.0.1:19890;
            fastcgi_index index.cgi;
            fastcgi_param SCRIPT_FILENAME fcgi$fastcgi_script_name;
            include       fastcgi.conf;
        }

        location /opt/course/ {
            # 启用自动索引
            autoindex on;
            # 禁用访问日志记录
            access_log off;
            # 添加适当的头部信息
            default_type application/json;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:9000;  # 后端 WebSocket 服务地址
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # 防止 WebSocket 连接过早关闭
            proxy_read_timeout 3600s;
        }
    }

    # --------------------hls转发直播--------------------
    # server {
    #     listen 7070;

    #     location /hls {
    #         types {
    #             application/vnd.apple.mpegurl m3u8;
    #             video/mp2t ts;
    #         }
