user root;
# auto自动选择，指定nginx要开启的进程数,每个进程平均消耗10-12MB
worker_processes 1;

# 日志路径
# error_log /opt/course/log/nginx/error.log;
# 输出日志的级别为notice
# error_log /opt/course/log/nginx/error.log notice;
# 输出日志的级别为info
# error_log /opt/course/log/nginx/error.log info;
# 输出日志的级别为info
error_log /dev/null info;

# pid /opt/cam/third-party/nginx/logs/nginx.pid;
worker_rlimit_nofile 1024;

events {
    worker_connections 105;
    multi_accept on;
}

