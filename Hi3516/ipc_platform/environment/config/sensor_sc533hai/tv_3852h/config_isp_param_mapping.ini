[awb.preset.daylight.day]
r_gain = 500
gr_gain = 256
gb_gain = 256
b_gain = 500

[awb.preset.daylight.night_white]
r_gain = 500
gr_gain = 256
gb_gain = 256
b_gain = 500

[awb.preset.daylight.night_ir]
r_gain = 500
gr_gain = 256
gb_gain = 256
b_gain = 500

# 降噪缩放只限制原网页值到0~100，随后叠加user_offset并直接乘除，不会二次截断。
# SNR公式为web * 255 / 100；TNR公式为(web + 10) * 16 / 100，网页100必须得到17。
# 普通和高级模式共用这两套规则；DNR等级仍是MPP字段fine_g1直通值，不在本文件缩放。
[nr.snr.day]
user_offset = 0
multiplier = 255
divisor = 100

[nr.snr.night_white]
user_offset = 0
multiplier = 255
divisor = 100

[nr.snr.night_ir]
user_offset = 0
multiplier = 255
divisor = 100
[nr.tnr.day]
user_offset = 10
multiplier = 16
divisor = 100

[nr.tnr.night_white]
user_offset = 10
multiplier = 16
divisor = 100

[nr.tnr.night_ir]
user_offset = 10
multiplier = 16
divisor = 100
