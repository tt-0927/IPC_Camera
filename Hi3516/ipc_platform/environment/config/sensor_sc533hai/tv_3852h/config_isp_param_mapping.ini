# TV-3852H与TV-3852HZT共用的网页参数到MPP参数值映射。
# 生效时机：ISP服务启动时读取；修改后需要重启服务或设备。
# 网页输入统一为0~100，系统值按网页值、user_offset和system范围线性换算。
# system_min/system_max是MPP字段范围，不是网页显示范围。
# 修改时必须保持system_min < system_max，且不能删除必填section或key。
[meta]
# 配置结构版本；当前仅支持3，升级代码前不要自行修改。
schema_version = 3

# 三个运行场景：day为白天，night_white为夜晚白光/全彩，night_ir为红外、智能红外和关灯低照。
# 所有网页参数映射均按运行场景独立配置；未调参的场景保持与day相同数值。
# 映射规则：先将网页值加user_offset并限制到0~100，再线性映射到system_min~system_max。
[brightness.day]
system_min = 20
system_max = 60
user_offset = 19
[brightness.night_white]
system_min = 24
system_max = 64
user_offset = 23
[brightness.night_ir]
system_min = 20
system_max = 60
user_offset = 19

# 锐度映射。operation_mode=manual写入MPP手动档；auto写入自动ISO各档的最大锐度上限。
# 修改operation_mode会改变MPP控制模式，不只是改变锐度数值。
[sharpness.day]
system_min = 0
system_max = 32
user_offset = -4
operation_mode = manual
[sharpness.night_white]
system_min = 0
system_max = 32
user_offset = -4
operation_mode = manual
[sharpness.night_ir]
system_min = 0
system_max = 35
user_offset = -10
operation_mode = auto

# WDR强度映射；system_min/system_max为MPP DRC/WDR强度范围，不是百分比。
[wdr.day]
system_min = 0
system_max = 600
user_offset = 0
[wdr.night_white]
system_min = 0
system_max = 600
user_offset = 0
[wdr.night_ir]
system_min = 0
system_max = 600
user_offset = 0

# 对比度和饱和度按三场景独立映射；当前数值相同，后续可只调整目标场景。
[contrast.day]
system_min = 35
system_max = 100
user_offset = -26

[contrast.night_white]
system_min = 35
system_max = 100
user_offset = -26

[contrast.night_ir]
system_min = 35
system_max = 100
user_offset = -26

[saturation.day]
system_min = 0
system_max = 100
user_offset = 0

[saturation.night_white]
system_min = 0
system_max = 100
user_offset = 0

[saturation.night_ir]
system_min = 0
system_max = 100
user_offset = 0

# 三场景曝光补偿表。每行必须恰好16个0~255整数，逗号分隔。
# 数组顺序必须与MPP ExposureAttr_S::enExpTime的16个曝光时间档位一致，不可增删或重排。
[exposure_compensation]
day = 60, 57, 54, 50, 47, 44, 43, 42, 40, 38, 36, 35, 34, 33, 32, 30
night_white = 60, 57, 54, 50, 47, 44, 43, 42, 40, 38, 36, 35, 34, 33, 32, 30
night_ir = 70, 68, 64, 60, 56, 54, 53, 52, 50, 48, 46, 45, 44, 43, 42, 40

# 强光抑制（HLC）通过曝光tolerance实现；网页值越大，tolerance越小、抑制越强。
# enabled时按system_max - web_value * (system_max - system_min) / 100计算；关闭时写disabled_value。
[hlc.day]
system_min = 0
system_max = 4
disabled_value = 2

[hlc.night_white]
system_min = 0
system_max = 4
disabled_value = 2

[hlc.night_ir]
system_min = 0
system_max = 4
disabled_value = 2

# AWB手动模式：网页R/B增益使用通用线性映射，当前保持0~100映射到MPP 0~1000。
# 预设模式使用标定后的四通道MPP增益，r/gr/gb/b必须都配置，不能仅配置网页可见的R/B。
[awb.manual.day]
system_min = 0
system_max = 1000
user_offset = 0

[awb.manual.night_white]
system_min = 0
system_max = 1000
user_offset = 0

[awb.manual.night_ir]
system_min = 0
system_max = 1000
user_offset = 0

[awb.preset.lock.day]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 506

[awb.preset.lock.night_white]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 506

[awb.preset.lock.night_ir]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 506
[awb.preset.incandescent.day]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 584

[awb.preset.incandescent.night_white]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 584

[awb.preset.incandescent.night_ir]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 584
[awb.preset.warm.day]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 590

[awb.preset.warm.night_white]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 590

[awb.preset.warm.night_ir]
r_gain = 506
gr_gain = 256
gb_gain = 256
b_gain = 590
[awb.preset.fluorescent.day]
r_gain = 597
gr_gain = 256
gb_gain = 256
b_gain = 667

[awb.preset.fluorescent.night_white]
r_gain = 597
gr_gain = 256
gb_gain = 256
b_gain = 667

[awb.preset.fluorescent.night_ir]
r_gain = 597
gr_gain = 256
gb_gain = 256
