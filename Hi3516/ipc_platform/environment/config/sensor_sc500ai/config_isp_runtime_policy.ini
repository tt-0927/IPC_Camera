# SC500AI ISP运行策略。当前该Sensor沿用共享基线，不区分设备子目录。
# 生效时机：ISP服务启动时读取；修改后需要重启服务或设备。
# 本文件控制日夜、Scene、DRC、Sensor Gamma和安装方向，不替换MPP Scene/IQ静态配置。
# 配置缺失、格式错误、版本不匹配或值越界会导致ISP初始化失败。
[meta]
# 配置结构版本；当前仅支持1，升级代码前不要自行修改。
schema_version = 1

# 日夜自动切换阈值。daynight.<焦距>由SENSOR_TYPE末段选择；找不到时回退到daynight.default。
# 当前f8mm有意使用default。*_to_day_brightness是MPP AE统计阈值，不是Lux或网页百分比。
# *_rg/*_bg是白平衡R/G、B/G统计阈值；white_*用于白光，ir_*用于红外。
[daynight.default]
white_to_day_brightness = 40000000
ir_to_day_brightness = 10000000
white_rg = 160
white_bg = 185
ir_rg = 240
ir_bg = 240

# f2.8mm镜头专用日夜切换阈值。
[daynight.f2_8mm]
white_to_day_brightness = 40000000
ir_to_day_brightness = 10000000
white_rg = 160
white_bg = 185
ir_rg = 240
ir_bg = 240

# f4mm镜头专用日夜切换阈值。
[daynight.f4mm]
white_to_day_brightness = 7000000
ir_to_day_brightness = 10000000
white_rg = 145
white_bg = 185
ir_rg = 240
ir_bg = 240

# f6mm镜头专用日夜切换阈值。
[daynight.f6mm]
white_to_day_brightness = 3000000
ir_to_day_brightness = 10000000
white_rg = 160
white_bg = 185
ir_rg = 240
ir_bg = 240

# 内部运行场景到MPP Scene video_mode[]的索引映射，允许范围0~2。
# day为白天，night_white为夜晚白光/全彩，night_ir为红外、智能红外和关灯低照。
# 修改索引会整体切换一套MPP Scene/IQ配置，必须确认目标Scene内容后再调整。
[scene]
day_index = 0
night_white_index = 0
night_ir_index = 1

# Scene生效后的DRC覆盖策略，分别按day/night_white/night_ir运行场景执行。
# override=false时完全保留MPP Scene/IQ的DRC结果，enable/use_manual_strength/strength不生效。
# override=true时，enable控制DRC开关；use_manual_strength=true会切为手动DRC并使用strength。
# strength仅在use_manual_strength=true时生效，允许范围0~1023。
[scene.drc.day]
override = true
enable = false
use_manual_strength = false
strength = 0

[scene.drc.night_white]
override = true
enable = false
use_manual_strength = false
strength = 0

[scene.drc.night_ir]
override = false
enable = false
use_manual_strength = false
strength = 0

# 是否在场景应用后使用当前Sensor驱动提供的静态CMOS Gamma曲线。
# SC500AI当前不提供本配置要求的静态Gamma资源，必须保持false；配置true会导致ISP初始化失败。
[gamma]
use_sensor_cmos = false

# 吸顶安装方向策略。true时镜像/翻转方向按吸顶机型处理；false时按普通安装方向处理。
# 本项不改变MPP Scene/IQ静态配置或日夜运行场景。
[mount]
ceiling = false

# SC500AI目录由多个设备共享；以下为设备专用覆盖段，用于保留原设备差异。
# section后缀由DEVICE_TYPE规范化得到，例如TV-3852H对应tv_3852h。
# 专用section一旦存在，加载器会完整使用该section，不会从通用section补齐缺失key。
# 因此新增或修改专用section时，必须保留该section要求的全部字段。
# 以下组覆盖对应设备的Scene索引；未列出的设备继续使用上方通用Scene。
[scene.tv_3852h]
day_index = 0
night_white_index = 2
night_ir_index = 1

[scene.tv_3852hl]
day_index = 0
night_white_index = 2
night_ir_index = 1

[scene.tv_3852hzt]
day_index = 0
night_white_index = 2
night_ir_index = 1

[scene.tv_3852tl4g]
day_index = 0
night_white_index = 2
night_ir_index = 1

[scene.tv_3852tlw]
day_index = 0
night_white_index = 2
night_ir_index = 1

# 以下组仅覆盖对应设备的吸顶安装方向。
[mount.tv_3852h]
ceiling = true

[mount.tv_3852hl]
ceiling = true

[mount.tv_3852hzt]
ceiling = true

# 以下组覆盖对应设备的夜晚白光DRC策略；override=false表示保留MPP Scene/IQ的DRC结果。
[scene.drc.night_white.tv_3852h]
override = false
enable = false
use_manual_strength = false
strength = 0

[scene.drc.night_white.tv_3852hl]
override = false
enable = false
use_manual_strength = false
strength = 0

[scene.drc.night_white.tv_3852hzt]
override = false
enable = false
use_manual_strength = false
strength = 0

[scene.drc.night_white.tv_3852tl4g]
override = false
enable = false
use_manual_strength = false
strength = 0

[scene.drc.night_white.tv_3852tlw]
override = false
enable = false
use_manual_strength = false
strength = 0
